<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-label="Basketball Experience draft design system">
<rect width="1440" height="980" fill="#f2f7fa"/>
<rect width="1440" height="170" fill="#17212b"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="64" y="65" font-size="18" fill="#38b6ff" letter-spacing="3">THE BASKETBALL EXPERIENCE</text><text x="64" y="118" font-size="42" fill="white" font-weight="bold">ONE COMMUNITY. ONE EXPERIENCE.</text><text x="1050" y="65" font-size="17" fill="white">DESIGN HANDOFF · DRAFT</text>
<text x="64" y="224" font-size="25" fill="#17212b" font-weight="bold">Brand palette and typography</text>
<rect x="64" y="250" width="240" height="105" rx="8" fill="#38b6ff"/><text x="82" y="294" fill="#17212b" font-size="21">Sky blue</text><text x="82" y="330" fill="#17212b" font-size="17">#38B6FF · Action / accent</text>
<rect x="328" y="250" width="240" height="105" rx="8" fill="#17212b"/><text x="346" y="294" fill="white" font-size="21">Charcoal</text><text x="346" y="330" fill="white" font-size="17">#17212B · Headings / nav</text>
<rect x="592" y="250" width="240" height="105" rx="8" fill="white" stroke="#dce5eb"/><text x="610" y="294" fill="#17212b" font-size="21">White / pale background</text><text x="610" y="330" fill="#596b7a" font-size="17">#FFFFFF / #F2F7FA</text>
<text x="890" y="280" font-size="24" fill="#17212b">Headings: Oswald</text><text x="890" y="314" font-size="18" fill="#596b7a">Body: Arial / Helvetica / system sans</text><text x="890" y="348" font-size="18" fill="#596b7a">48 px touch controls · 16 px phone inputs</text>
<text x="64" y="417" font-size="25" fill="#17212b" font-weight="bold">Reusable interface patterns</text>
<rect x="64" y="448" width="410" height="252" rx="10" fill="white" stroke="#dce5eb"/><text x="88" y="488" font-size="23" fill="#17212b">Program registration</text><text x="88" y="526" font-size="18" fill="#596b7a">Player → eligibility → waiver → invoice</text><rect x="88" y="554" width="360" height="52" rx="4" fill="#fff" stroke="#9ab1c1"/><text x="102" y="586" font-size="17" fill="#17212b">Choose your player</text><rect x="88" y="626" width="210" height="48" rx="4" fill="#38b6ff"/><text x="109" y="657" font-size="18" fill="#17212b">Review registration</text>
<rect x="514" y="448" width="410" height="252" rx="10" fill="white" stroke="#dce5eb"/><text x="538" y="488" font-size="23" fill="#17212b">Staff review</text><text x="538" y="526" font-size="18" fill="#596b7a">Evidence, expiry and a written decision</text><rect x="538" y="555" width="360" height="48" rx="4" fill="#eff8ff"/><text x="552" y="586" font-size="18" fill="#17212b">Awaiting review</text><rect x="538" y="626" width="168" height="48" rx="4" fill="#17212b"/><text x="559" y="657" font-size="18" fill="white">Save decision</text><rect x="722" y="626" width="176" height="48" rx="4" fill="white" stroke="#9ab1c1"/><text x="745" y="657" font-size="18" fill="#17212b">View document</text>
<rect x="964" y="448" width="410" height="252" rx="10" fill="white" stroke="#dce5eb"/><text x="988" y="488" font-size="23" fill="#17212b">Feedback and progress</text><text x="988" y="526" font-size="18" fill="#596b7a">Clear labels, numerical results and context</text><rect x="988" y="563" width="360" height="18" rx="9" fill="#dce5eb"/><rect x="988" y="563" width="240" height="18" rx="9" fill="#176292"/><text x="988" y="620" font-size="18" fill="#17212b">Sample: 2 of 3 exercises complete</text><text x="988" y="656" font-size="17" fill="#596b7a">Never communicate status by color alone.</text>
<text x="64" y="767" font-size="25" fill="#17212b" font-weight="bold">Responsive roles and navigation</text><text x="64" y="809" font-size="20" fill="#17212b">Parent: family, programs, calendar, store, training and messages</text><text x="64" y="847" font-size="20" fill="#17212b">Coach: team attendance, playbook, video, feedback and staff documents</text><text x="64" y="885" font-size="20" fill="#17212b">Staff / admin: operations, schedules, inventory, approvals and reports</text><text x="64" y="944" font-size="16" fill="#596b7a">Editable SVG import for Figma. This is a handoff board, not an approved brand or a native Figma component library.</text>
</g></svg>